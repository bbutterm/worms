<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1021" />

<!-- «На экран Домой» запускает игру без адресной строки. На iPhone это
     единственный способ получить полный экран: Safari там не поддерживает
     Fullscreen API для произвольных элементов. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Worms" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Worms Prototype</title>
<style>
  /* Шрифт интерфейса. Кириллица и латиница отдельными подмножествами:
     браузер тянет только нужное. Системный моноширинный, который был
     раньше, и делал интерфейс похожим на отладочный оверлей. */
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 700; font-display: block;
    src: url('./assets/font/nunito-700-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 700; font-display: block;
    src: url('./assets/font/nunito-700-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2191-2193, U+2212, U+2215;
  }
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 800; font-display: block;
    src: url('./assets/font/nunito-800-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Worms UI'; font-style: normal; font-weight: 800; font-display: block;
    src: url('./assets/font/nunito-800-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2122, U+2191-2193, U+2212, U+2215;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    /* 100% на iOS — это «большой» вьюпорт, тот, что без панели браузера:
       верх страницы уезжает под адресную строку. dvh — реально видимая
       высота прямо сейчас; 100% оставлен запасным для старых браузеров. */
    height: 100%;
    height: 100dvh;
    background: #0b1021;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #game { width: 100%; height: 100%; }
  #game canvas { display: block; }
  #fatal {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #ffb4b4; background: #0b1021; text-align: center;
    padding: 24px; line-height: 1.5; font-size: 15px;
  }
  /* Игра ландшафтная: в портрете канвас 1280x720 ужимается в узкую полоску,
     поэтому вместо неё показываем просьбу повернуть устройство. */
  #rotate {
    position: fixed; inset: 0; display: none; z-index: 10;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0b1021; color: #c3cee0;
    text-align: center; padding: 24px; line-height: 1.5; font-size: 16px;
  }
  #rotate .phone {
    width: 54px; height: 92px; border: 3px solid #6ecbff; border-radius: 10px;
    animation: tilt 1.8s ease-in-out infinite;
  }
  @keyframes tilt {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">
  <div class="phone"></div>
  <div>Поверни телефон горизонтально</div>
</div>
<div id="fatal"></div>

<!-- Telegram WebApp SDK: no-op в обычном браузере -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Phaser 3 через CDN, с фолбэком на второй хост -->
<script>
  (function loadPhaser() {
    var sources = [
      'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
      'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js',
      './vendor/phaser.min.js'   // локальная копия на случай, если CDN недоступен
    ];
    var i = 0;
    function next() {
      if (i >= sources.length) {
        var el = document.getElementById('fatal');
        el.style.display = 'flex';
        el.textContent = 'Не удалось загрузить Phaser 3 ни с одного CDN. Проверьте сеть.';
        return;
      }
      var s = document.createElement('script');
      s.src = sources[i++];
      s.onload = boot;
      s.onerror = next;
      document.head.appendChild(s);
    }
    function boot() {
      var m = document.createElement('script');
      m.type = 'module';
      m.src = './src/main.js';
      document.body.appendChild(m);
    }
    next();
  })();
</script>
</body>
</html>
